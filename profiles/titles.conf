# titles.conf — reference copy of the compiled-in per-title profile table.
#
# The SOURCE OF TRUTH is kTitles[] in
#     files/core/hw/pvr/speedhack.cpp
# This file exists so you can eyeball and diff the table without reading C++.
# If you change one, change the other.
#
# Serial comes from the boot log line "Game ID: XXXXXXXXX".
# Verify your region revision — US/EU/JP serials differ.
#
# Field meaning:
#   perStrip   flush non-opaque TA lists at end-of-list (helps translucent-heavy
#              scenes, hurts opaque-heavy ones — measure per title)
#   modVols    1 = DROP the modifier-volume stencil pass
#   shadowPass 1 = DROP the translucent depth pre-pass
#   rtt        1 = DROP render-to-texture / framebuffer readback
#   aicaDSP    1 = RUN the Yamaha DSP (0 = bypass it)
#   sampleDiv  1 = 44.1kHz, 2 = 22.05kHz, 4 = 11.025kHz

[sonic-adventure-us]
serial       = MK-51000
preset       = Fastest
perStrip     = 0
modVols      = 1
shadowPass   = 1
rtt          = 1
forceNearest = 1
lodBias      = -1
aicaDSP      = 0
sampleDiv    = 2
arm7Alt      = 1
note         = FTRV-heavy geometry + real shadow volumes. The modvol and RTT
               cuts are the whole ballgame; leave batching alone.

