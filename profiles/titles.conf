[virtua-tennis-us]
serial       = MK-51036
preset       = Speed
perStrip     = 0
modVols      = 1
shadowPass   = 0
rtt          = 1
forceNearest = 1
lodBias      = 0
aicaDSP      = 1
sampleDiv    = 1
arm7Alt      = 0
note         = Tiny scene, already fast. Do NOT drop the shadow pass (the ball
               shadow is gameplay-relevant) and do NOT drop the DSP (ball-hit
               transients go mushy at low sample rates, which is a feel
               regression — exactly what this exercise is meant to protect).
